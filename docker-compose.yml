name: llm

services:
  ollama:
    image: ollama/ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      - OLLAMA_CONTEXT_LENGTH=16384
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  ollama-cpu:
    image: ollama/ollama
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama-cpu:/root/.ollama
    environment:
      - OLLAMA_CONTEXT_LENGTH=16384
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:cuda
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      - WEBUI_SECRET_KEY=uuuuuhsecretbutnotworking
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  ollama:
  ollama-cpu:
  open-webui: