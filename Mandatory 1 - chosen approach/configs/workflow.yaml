goal: create a web based application, both a frontend and a backend that runs over rest, that makes use of CRUD operations, it needs to support the ordering of meal tickets

project:
  repository_path: demo_repo
  artifact_path: artifacts

ollama_endpoints:
  ollama_primary:
    base_url: http://localhost:11434
  ollama_secondary:
    base_url: http://localhost:11435

default_profile: qwen2_5_coder_3b

model_profiles:
  qwen2_5_coder_3b:
    endpoint: ollama_primary
    model: qwen2.5-coder:3b
  qwen2_5_coder_7b:
    endpoint: ollama_primary
    model: qwen2.5-coder:7b
  qwen3_4b:
    endpoint: ollama_primary
    model: qwen3:4b
  llama3_1_8b:
    endpoint: ollama_secondary
    model: llama3.1:8b

roles:
  architect:
    temperature: 0.2
  tech_lead:
    temperature: 0.1
  implementer_a:
    temperature: 0.1
  implementer_b:
    temperature: 0.1
  tester:
    temperature: 0.0
  documenter:
    temperature: 0.2
  deployment_validator:
    temperature: 0.0

controls:
  ask_before_commands: true
  ask_before_file_edits: true
  max_backlog_revision_iterations: 4
  max_implementation_completion_iterations: 1
  max_implementation_verification_iterations: 1
  max_repair_iterations: 2
  commit_after_each_stage: false
