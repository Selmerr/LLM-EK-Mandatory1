openapi: 3.0.1
info:
  title: Notes API
  version: 1.0.0
paths:
  /notes:
    get:
      description: Retrieve a list of all notes.
      responses:
        '200':
          description: A JSON array of note objects.
    post:
      description: Create a new note.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
      responses:
        '201':
          description: The created note object with id.
  /notes/{id}:
    delete:
      description: Delete a note by its ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Note deleted successfully.
